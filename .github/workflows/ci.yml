name: CI

on:
  push:
  pull_request:

jobs:
  manifest:
    name: Manifest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-manifest.mjs

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build agent
        run: dotnet build src/WinUtil.Agent/WinUtil.Agent.csproj -c Release
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path ./PowerShell -Recurse -Severity Error
          if ($issues) { $issues | Format-Table; exit 1 }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0
          Invoke-Pester ./tests -CI
